name: Rebuild Knowledge Base Index (Weekly)

on:
  schedule:
    - cron: '0 21 * * 0'  # UTC 21:00 Sunday = 台灣週一 05:00
  workflow_dispatch:       # 手動觸發

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawlers/requirements_v2.txt

      - name: Build knowledge base index (full rebuild)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python crawlers/build_knowledge_index.py
