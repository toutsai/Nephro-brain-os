# ⚠️ 停用自動觸發：此 workflow 有 IAM 權限問題無法成功部署（且 --project 指向舊專案）。
# 正式部署方式：使用者在本機執行
#   gcloud run deploy nephro-brain-api --source ./backend --region asia-east1 --clear-base-image
# 修好 IAM 前僅保留手動觸發入口，避免每次 backend 改動都跑出失敗紅叉。
name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:  # 手動觸發

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy nephro-brain-api \
            --source ./backend \
            --region asia-east1 \
            --project gen-lang-client-0247770936 \
            --clear-base-image \
            --quiet
