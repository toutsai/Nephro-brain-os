name: Cochrane Reviews Weekly Crawler

on:
  schedule:
    - cron: '0 23 * * 0'  # UTC 23:00 Sunday = 台灣週一 07:00
  workflow_dispatch:       # 手動觸發

jobs:
  crawl-cochrane:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawlers/requirements_v2.txt

      - name: Run Cochrane crawler
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python crawlers/crawler_cochrane.py --limit 30 --days 7
